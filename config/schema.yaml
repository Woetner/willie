# WILL-E settings schema (WILL-E.md §5.4, decision D13).
# Every tunable value is declared here once: type, default, limits, unit, help.
# The dashboard form is generated from this file; willie.yaml only holds values.
# Types: float, int, bool, str, choice (needs `options`), time ("HH:MM").
# `restart: true` = change only takes effect after a restart (no hot reload).

drive:
  _label: Drive
  max_speed:      {type: float, default: 0.25, min: 0.05, max: 0.6, unit: m/s, help: Top driving speed}
  accel:          {type: float, default: 0.5, min: 0.1, max: 2.0, unit: m/s², help: Acceleration limit}
  pwm_cap:        {type: int, default: 50, min: 10, max: 50, unit: "%", help: Hard motor PWM cap (6 V motors on 12.6 V). Never above 50.}
  pid_on:         {type: bool, default: false, help: "Wheel speed loop in the firmware (F2). Turn on after B12 confirmed the encoder directions; it switches itself off on a sign fault"}
  pid_kp:         {type: float, default: 1.0, min: 0, max: 20, help: "Wheel speed PID – P, on the speed error in duty % (unitless)"}
  pid_ki:         {type: float, default: 2.0, min: 0, max: 20, unit: 1/s, help: Wheel speed PID – I}
  pid_kd:         {type: float, default: 0.0, min: 0, max: 5, unit: s, help: Wheel speed PID – D}
  wheel_diameter: {type: float, default: 100.0, min: 60, max: 140, unit: mm, help: Calibrated in F3}
  track_width:    {type: float, default: 170.0, min: 100, max: 250, unit: mm, help: Wheel centre to centre, calibrated in F3}
  encoder_cpr:    {type: int, default: 960, min: 1, max: 10000, unit: counts/rev, help: Counts per wheel revolution, measured in B12}

safety:
  _label: Safety
  tof_stop_mm:         {type: int, default: 120, min: 30, max: 500, unit: mm, help: Stop when a ToF sensor sees something closer}
  cliff_threshold:     {type: int, default: 1, min: 0, max: 1, help: PCF8574 level that means "no floor"}
  bumper_reverse_mm:   {type: int, default: 50, min: 0, max: 200, unit: mm, help: Reverse distance after a bumper hit}
  battery_warn_v:      {type: float, default: 10.5, min: 9.9, max: 12.0, unit: V, help: Low-battery warning}
  battery_cutoff_v:    {type: float, default: 9.9, min: 9.3, max: 11.0, unit: V, help: Safe poweroff below this}
  watchdog_ms:         {type: int, default: 200, min: 50, max: 500, unit: ms, help: Motors stop if no command within this time}
  tilt_stop_deg:       {type: int, default: 25, min: 10, max: 45, unit: °, help: Stop when tilted more than this}

head:
  _label: Head (pan / tilt)
  pan_min_deg:   {type: int, default: -90, min: -90, max: 0, unit: °}
  pan_max_deg:   {type: int, default: 90, min: 0, max: 90, unit: °}
  tilt_min_deg:  {type: int, default: -30, min: -45, max: 0, unit: °}
  tilt_max_deg:  {type: int, default: 45, min: 0, max: 60, unit: °}
  pan_trim_us:   {type: int, default: 0, min: -300, max: 300, unit: µs, help: Servo centre trim}
  tilt_trim_us:  {type: int, default: 0, min: -300, max: 300, unit: µs, help: Servo centre trim}
  speed_dps:     {type: int, default: 120, min: 10, max: 400, unit: °/s, help: Head move speed}

face:
  _label: Face
  eye_style:   {type: choice, default: round, options: [round, visor, pixel], help: Eye shape}
  eye_color:   {type: str, default: "#39d0ff", help: Eye colour (hex)}
  bg_color:    {type: str, default: "#000000", help: Background colour (hex)}
  brightness:  {type: int, default: 80, min: 5, max: 100, unit: "%"}
  fps:         {type: int, default: 15, min: 5, max: 30, unit: fps, help: Face render rate (panel throughput must be measured)}
  blink_rate:  {type: float, default: 4.0, min: 0.5, max: 20, unit: /min, help: Average blinks per minute}
  dance_every_s: {type: int, default: 60, min: 0, max: 900, unit: s, help: "While Spotify plays on his speaker: average time between dances (0 = never dance)"}
  dance_s:     {type: float, default: 8, min: 2, max: 60, unit: s, help: How long one dance lasts}
  touch_x_min: {type: int, default: 900, min: 0, max: 4095, help: "Touch calibration (K1 pinout zoom/drag): raw ADC at the left edge"}
  touch_x_max: {type: int, default: 3200, min: 0, max: 4095, help: Raw ADC at the right edge}
  touch_y_min: {type: int, default: 580, min: 0, max: 4095, help: Raw ADC at the top edge}
  touch_y_max: {type: int, default: 2960, min: 0, max: 4095, help: Raw ADC at the bottom edge}
  touch_swap_xy: {type: bool, default: false, help: "Swap the touch axes (dragging left moves the drawing up/down)"}
  touch_flip_x: {type: bool, default: false, help: Dragging left/right moves the drawing the wrong way}
  touch_flip_y: {type: bool, default: false, help: Dragging up/down moves the drawing the wrong way}

mood:
  _label: Mood
  energy_base:     {type: float, default: 0.6, min: 0, max: 1, help: Baseline energy}
  curiosity_base:  {type: float, default: 0.7, min: 0, max: 1, help: Baseline curiosity}
  social_base:     {type: float, default: 0.6, min: 0, max: 1, help: Baseline need for company}
  happiness_base:  {type: float, default: 0.6, min: 0, max: 1, help: Baseline happiness}
  drift_rate:      {type: float, default: 0.02, min: 0, max: 0.5, unit: /min, help: How fast moods return to baseline}
  boredom_rate:    {type: float, default: 0.05, min: 0, max: 1, unit: /min, help: How fast boredom rises while nothing happens}
  attention_decay: {type: float, default: 0.5, min: 0.01, max: 5, unit: /min, help: How fast attention fades after a wake word or a face}

behavior:
  _label: Behaviour
  wander:          {type: bool, default: false, help: Wander around on his own}
  wander_pause_s:  {type: int, default: 90, min: 5, max: 1800, unit: s, help: "Average pause between wander trips (shorter when curious and awake)"}
  wander_max_m:    {type: float, default: 0.6, min: 0.1, max: 2.0, unit: m, help: Longest single wander leg}
  respect_s:       {type: int, default: 120, min: 0, max: 3600, unit: s, help: "No wandering this long after someone drove him (voice, app, CLI)"}
  quiet_start:     {type: time, default: "23:00", help: Quiet hours start}
  quiet_end:       {type: time, default: "07:30", help: Quiet hours end}
  patrol_list:     {type: str, default: "printer, garage door, kitchen", help: Comma-separated place names}
  follow_distance: {type: int, default: 600, min: 300, max: 1500, unit: mm}

voice:
  _label: Voice
  adapter:         {type: choice, default: gemini_live, options: [gemini_live, openai_realtime], restart: true, help: Chosen at Gate G1}
  model:           {type: str, default: "", restart: true, help: Model id (empty = adapter default)}
  volume:          {type: float, default: 0.35, min: 0.02, max: 0.8, help: "Speaker volume for voice and chimes (0.15 = quiet desk, 0.35 = room, 0.8 = max)"}
  speed:           {type: float, default: 1.0, min: 0.7, max: 1.5, help: Speaking speed}
  robot_filter:    {type: float, default: 0.3, min: 0, max: 1, help: Amount of robot voice filter}
  wake_sensitivity: {type: float, default: 0.5, min: 0.1, max: 0.95, help: Wake-word threshold}
  wake_gain:       {type: float, default: 8.0, min: 1, max: 32, help: "Digital mic gain for wake word + recorder (INMP441 is quiet; left channel only)"}
  search:          {type: bool, default: false, help: "Google Search in conversations. Needs a paid Gemini key for the 3.x models (free tier: quota 0)"}
  language:        {type: choice, default: nl, options: [nl, en, auto], help: "Conversation language (nl = Dutch unless you speak English)"}
  followup_s:      {type: float, default: 20, min: 3, max: 60, unit: s, help: "After the last words he keeps listening this long without 'Hey Willie', then sleeps"}
  standby_s:       {type: float, default: 60, min: 0, max: 600, unit: s, help: "When he decides talk is not for him he stays connected but silent this long; 'Hey Willie' then answers instantly"}
  lean_tools:      {type: bool, default: true, help: "Small prompt (L2): only the core tools in full, the rest behind one 'doe' tool with a short list. Off = all tool schemas in every turn (about 3x the prompt tokens)"}
  window_trigger_tokens: {type: int, default: 12000, min: 0, max: 100000, help: "Cap on what one turn re-reads (L4): past this many tokens the oldest turns are dropped (0 = no cap; the system prompt always stays)"}
  window_target_tokens:  {type: int, default: 8000, min: 2000, max: 100000, help: "What is left after dropping old turns (below the cap)"}

modes:
  _label: Modes (Phase K)
  garage:          {type: bool, default: false, help: "Garage mode (K1): always listening without 'Hey Willie' but only to Wouter's voice, workshop tools, danger watch, no driving (he stands on the workbench)"}

garage:
  _label: Garage mode (K1)
  voice_check:     {type: choice, default: wouter, options: [wouter, iedereen], help: "wouter = only Wouter's voice reaches the model (checked on the home server); iedereen = everything he hears"}
  profile:         {type: str, default: wouter, help: "Voice profile on the home server (make voice-enroll)"}
  verify_s:        {type: float, default: 1.0, min: 0.5, max: 2.0, unit: s, help: "Speech sent to the voice check before anything reaches the model (longer = surer, slower)"}
  watch_s:         {type: int, default: 120, min: 0, max: 1800, unit: s, help: "Danger watch: one photo + the air values to the home server this often (0 = off)"}

search:
  _label: Search mode (K3)
  max_min:         {type: int, default: 10, min: 1, max: 60, unit: min, help: "Give up after this long (he also stops when the battery gets low)"}

adventure:
  _label: Adventure mode (K4)
  max_stops:       {type: int, default: 40, min: 3, max: 200, help: "Stops (4-direction scans) per adventure"}
  max_min:         {type: int, default: 30, min: 5, max: 120, unit: min, help: Longest adventure}

sentry:
  _label: Sentry mode (K5)
  look_s:          {type: int, default: 20, min: 5, max: 600, unit: s, help: "Daytime: one photo to the home server this often to spot changes and people"}

memory:
  _label: Memory
  context_chars:   {type: int, default: 4000, min: 2000, max: 200000, help: "How much long-term memory (facts + recent conversations) goes into every conversation. More = knows more without searching, but a slower start and more tokens per turn. Older things stay findable with herinner"}

skills:
  _label: Skills
  brandstof_url:   {type: str, default: "http://192.168.2.151:8000", help: "Brandstof health monitor on the home server (food, activity, sleep, training, air)"}
  disabled:        {type: str, default: "", help: "Skills switched off, comma-separated (use the Skills tab)"}

privacy:
  _label: Privacy
  mute:            {type: bool, default: false, help: Mic and camera off}
  camera_allowed:  {type: bool, default: true, help: Camera may be used}

dashboard:
  _label: Dashboard
  idle_minutes:    {type: int, default: 5, min: 1, max: 120, unit: min, help: Dashboard process exits after this long without a browser (D20); port 8080 stays open via systemd}
  log_lines:       {type: int, default: 300, min: 50, max: 2000, help: Lines shown in the log viewer}

link:
  _label: MCU link (D18)
  port:            {type: str, default: /dev/serial0, restart: true, help: Serial port to the ESP32 (Pi UART on GPIO14/15)}
  baud:            {type: int, default: 921600, min: 9600, max: 2000000, restart: true, help: Must match the firmware}
  ping_hz:         {type: float, default: 2.0, min: 0.2, max: 50, unit: Hz, help: Link health pings (round-trip time shown in the dashboard)}
