# WILL-E (added for Spotify, 24 Sep): music device for librespot.
# The MAX98357A plays one channel and this card only works at 48 kHz (B6), so
# stereo 44.1 kHz music is mixed to mono (L+R)/2 on both channels and resampled.
# The voice keeps using plughw:CARD=sndrpigooglevoi,DEV=0 directly.
pcm.willie_music {
    type route
    slave { pcm "willie_music_48k"; channels 2 }
    ttable.0.0 0.5
    ttable.1.0 0.5
    ttable.0.1 0.5
    ttable.1.1 0.5
}
pcm.willie_music_48k {
    type plug
    slave { pcm "hw:CARD=sndrpigooglevoi,DEV=0"; rate 48000 }
}
