; WILL-E real-time co-processor firmware (D18). Build/flash from the Mac:
;   make fw / make flash / make monitor          (in willie/)
; Board: classic ESP32-WROOM-32 DevKit, 30-pin, CH340 (D18, changed 21 Sep from ESP32-S3).
; Pin map: src/pins.h = WILL-E.md §5.2.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200
lib_deps =
    pololu/VL53L0X@^1.3.1
build_flags =
    -DFW_VERSION=\"0.2.0\"
    -DBOARD_NAME=\"esp32dev\"
    -DLINK_BAUD=921600
