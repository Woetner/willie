; WILL-E real-time co-processor firmware (D18). Build/flash from the Mac:
;   make fw / make flash / make monitor          (in willie/, MCU=esp32s3 or esp32dev)
; A9 scope: blink + ping/pong over the link UART. Later: motors, encoders, servos,
; I2C sensors, 200 ms watchdog + PWM cap, wake word (D19).

[platformio]
default_envs = esp32s3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags =
    -DFW_VERSION=\"0.1.0\"
    -DLINK_BAUD=921600

; the planned board (D18): ESP32-S3 DevKitC-1 or equivalent.
; Debug output on the native USB port; link UART on GPIO17 (TX) / GPIO18 (RX) per §5.2.
; Blink uses the on-board RGB LED (GPIO48 on DevKitC-1 v1.0, GPIO38 on v1.1: if it stays dark
; on a v1.1 board, the link still works — check `make monitor`).
[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_NAME=\"esp32s3\"
    -DLINK_TX=17
    -DLINK_RX=18

; bench board: 30-pin ESP32-WROOM-32 DevKit (CH340). Link on GPIO17 (TX) / GPIO16 (RX),
; blue LED on GPIO2. Fine for A9; not for the wake word (D19 needs the S3).
[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DBOARD_NAME=\"esp32dev\"
    -DLINK_TX=17
    -DLINK_RX=16
    -DLED_PIN=2
